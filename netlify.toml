[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://*.clerk.accounts.dev https://*.clerk.services https://challenges.cloudflare.com https://*.protect.clerk.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.clerk.com https://*.google-analytics.com https://*.googletagmanager.com; media-src 'self'; font-src 'self'; connect-src 'self' https://*.clerk.accounts.dev https://*.clerk.services https://*.protect.clerk.com:* https://img.clerk.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com https://*.protect.clerk.com https://*.clerk.accounts.dev; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/account/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/sign-in/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/sign-up/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

[[redirects]]
  from = "/collections/fermented-pickles"
  to = "/shop"
  status = 301
  force = true

[[redirects]]
  from = "/products/fermented-cucumber-pickle"
  to = "/products/tropical-cucumber-pickle"
  status = 301
  force = true

[[redirects]]
  from = "/pickles"
  to = "/shop"
  status = 301
  force = true

[[redirects]]
  from = "/products/fermented-pale-vegetable-pickle"
  to = "/404.html"
  status = 410
  force = true

[functions]
  node_bundler = "esbuild"

[functions.product-page]
  included_files = ["dist/index.html", "dist/404.html"]
